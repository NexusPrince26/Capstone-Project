<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="40x40" href="./Images/StudyMate Education Logo.png">
    <link rel="stylesheet" href="./homepage.css">
    <title>StudyMate</title>
</head>
<body>
    <div class="container">
        <div class="image">
            <img src="./Images/StudyMate_ Learn, Improve, Achieve.png" alt="StudyMate Logo">
        </div>
        <div class="text">
            <h1>Welcome Back!</h1>
            <h5>Log in to continue your learning journey</h5>
            <div class="inputs">
                <div class="username">
                    <img src="./Images/person_48dp_173660_FILL0_wght400_GRAD0_opsz48.png" alt="A User-Icon">
                    <input placeholder="Email or Username">
                </div>
                <div class="password">
                    <img src="./Images/lock_48dp_173660_FILL0_wght400_GRAD0_opsz48.png" alt="A Lock Icon">
                    <input placeholder="Password">
                </div>
            </div>
            <div class="log-in">
                <button><a href="./dashboard.html" target="_self">Log In</a></button>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>
            <div class="create">
                <div class="divider">
                    <span>or</span>
                </div>
                <button>Create an Account</button>
            </div>
        </div>
    </div>
</body>
</html>
